version: "2"
sql:
  - engine: "sqlite"
    queries: "sqlc/query.sql"
    schema: "sqlc/schema.sql"
    gen:
      go:
        package: "db"
        out: "./db"
        sql_package: "database/sql"
        overrides:
          - column: "movies.watched_date"
            go_type:
              type: "Date"
